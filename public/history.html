<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Transcript History — ReelScribe</title>
<link rel="canonical" href="https://reelscribe.site/history.html">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0e0d10; --s1: #161418; --s2: #1c191e;
  --border: #2a262b; --border2: #38333a;
  --red: #ff3b30; --text: #f5f2ee; --sub: #a39d95; --muted: #665f5c;
}
body {
  background: var(--bg); color: var(--text);
  font-family: 'Archivo', -apple-system, sans-serif;
  max-width: 480px; margin: 0 auto; min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
.mono { font-family: 'IBM Plex Mono', monospace; }
.nav {
  position: sticky; top: 0; z-index: 999;
  background: rgba(14,13,16,0.9); backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 13px 20px;
}
.nav-logo { font-size: 16px; font-weight: 700; letter-spacing: -0.2px; display: flex; align-items: center; gap: 7px; }
.nav-logo .ndot { width: 7px; height: 7px; border-radius: 50%; background: var(--red); }
.nav-back {
  display: flex; align-items: center; gap: 6px;
  font-size: 13px; font-weight: 600; color: var(--sub);
  background: none; border: none; cursor: pointer;
  font-family: 'Archivo', sans-serif; transition: color .2s;
}
.nav-back svg { width: 14px; height: 14px; }
.nav-back:hover { color: var(--text); }

.hero { padding: 30px 22px 20px; }
.eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 10.5px; font-weight: 500; letter-spacing: 1.5px;
  text-transform: uppercase; color: var(--red); margin-bottom: 14px;
  font-family: 'IBM Plex Mono', monospace;
}
.eyebrow::before { content: ''; width: 14px; height: 1px; background: var(--border2); }
.page-h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 6px; }
.page-sub { font-size: 13px; color: var(--sub); line-height: 1.6; }

.main { padding: 0 22px 36px; }

.login-wall {
  background: var(--s1); border: 1px solid var(--border);
  border-radius: 10px; padding: 28px 20px; text-align: center; margin-top: 8px;
}
.login-wall p { font-size: 13.5px; color: var(--sub); margin-bottom: 16px; line-height: 1.6; }
.login-wall .btn {
  display: inline-block; padding: 12px 22px; border-radius: 6px;
  background: var(--red); color: #1a0a08; font-size: 12.5px; font-weight: 600;
  letter-spacing: 0.3px; text-transform: uppercase; text-decoration: none;
}

.history-item {
  background: var(--s1); border: 1px solid var(--border);
  border-radius: 10px; padding: 16px; margin-bottom: 12px;
}
.history-item-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.history-item-date { font-size: 11px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; }
.history-item-source { font-size: 10.5px; font-weight: 600; color: var(--red); text-transform: uppercase; letter-spacing: 0.4px; }
.history-item-url { font-size: 11.5px; color: var(--muted); word-break: break-all; margin-bottom: 10px; }
.history-item-transcript {
  font-size: 12.5px; color: var(--sub); line-height: 1.6;
  max-height: 90px; overflow: hidden; position: relative;
}
.history-item.expanded .history-item-transcript { max-height: none; }
.history-item-toggle { font-size: 11.5px; color: var(--red); font-weight: 600; margin-top: 8px; cursor: pointer; }

.state-msg { text-align: center; color: var(--muted); font-size: 13px; padding: 40px 0; }

footer { border-top: 1px solid var(--border); padding: 28px 22px 24px; text-align: center; }
.foot-copy { font-size: 11px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-logo"><span class="ndot"></span>ReelScribe</div>
  <button class="nav-back" onclick="window.location.href='/dashboard.html'">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 3L5 8l5 5"/></svg>
    Dashboard
  </button>
</nav>

<div class="hero">
  <div class="eyebrow"><span class="mono">History</span></div>
  <h1 class="page-h1">Your Transcripts</h1>
  <p class="page-sub">Every transcript you've generated, saved to your account.</p>
</div>

<div class="main">
  <div id="loginWall" class="login-wall" style="display:none">
    <p>Log in to view your saved transcript history.</p>
    <a class="btn" href="/login.html?next=/history.html">Log In</a>
  </div>

  <div id="historyList"></div>
</div>

<footer>
  <p class="foot-copy">© 2026 REELSCRIBE. ALL RIGHTS RESERVED.</p>
</footer>

<script>
// Identity comes from the server session — this page no longer accepts
// an arbitrary email to look up, which used to let anyone view anyone
// else's transcript history just by typing in their address.
async function loadHistory() {
  const list = document.getElementById("historyList");
  const loginWall = document.getElementById("loginWall");

  let loggedIn = false;
  try {
    const me = await fetch("/me").then(r => r.json());
    loggedIn = !!me.loggedIn;
  } catch (e) {}

  if (!loggedIn) {
    loginWall.style.display = "block";
    return;
  }

  list.innerHTML = '<div class="state-msg">Loading your history…</div>';

  try {
    const res = await fetch("/history");
    const data = await res.json();

    if (!data.success) {
      list.innerHTML = '<div class="state-msg">Could not load your history. Please try again.</div>';
      return;
    }

    if (!data.data || data.data.length === 0) {
      list.innerHTML = '<div class="state-msg">No transcripts yet — create your first one from the dashboard.</div>';
      return;
    }

    list.innerHTML = "";
    data.data.forEach(item => {
      const date = new Date(item.createdAt).toLocaleDateString("en-IN", {
        day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit"
      });
      const source = item.reelUrl?.includes("youtube") ? "YouTube" :
                     item.reelUrl?.includes("instagram") ? "Instagram" : "File Upload";

      const div = document.createElement("div");
      div.className = "history-item";
      div.innerHTML = `
        <div class="history-item-top">
          <div class="history-item-date">${date}</div>
          <div class="history-item-source">${source}</div>
        </div>
        <div class="history-item-url">${item.reelUrl || ""}</div>
        <div class="history-item-transcript"></div>
        <div class="history-item-toggle">Show more</div>
      `;
      div.querySelector(".history-item-transcript").textContent = item.transcript || "";
      const toggle = div.querySelector(".history-item-toggle");
      toggle.onclick = () => {
        div.classList.toggle("expanded");
        toggle.innerText = div.classList.contains("expanded") ? "Show less" : "Show more";
      };
      list.appendChild(div);
    });
  } catch (e) {
    list.innerHTML = '<div class="state-msg">Could not load your history. Please try again.</div>';
  }
}

loadHistory();
</script>
</body>
</html>
